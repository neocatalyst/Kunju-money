<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kunju Money</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kunju Money">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    color-scheme: dark;
    --bg: #15161F;
    --surface: #1E202C;
    --surface-2: #262838;
    --line: #33354a;
    --text: #EEEBE2;
    --text-dim: #9C9DB2;
    --milk: #F2C879;
    --milk-dim: #7a6636;
    --diaper: #7FB8A4;
    --diaper-dim: #3d5c52;
    --wet: #7FB0D8;
    --dirty: #C98A5A;
    --both: #A98AC9;
    --danger: #D8756B;
    --radius: 18px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; touch-action:manipulation;}
  html,body{
    margin:0;
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .screen{ padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + 78px + env(safe-area-inset-bottom)) 20px; }
  .hide{display:none !important;}

  /* hero stat — the single most prominent number on the home screen */
  .hero{
    position:relative;
    display:flex;
    align-items:flex-start;
    min-height:300px;
    margin-top:80px;
    padding:24px 4px 46px 4px;
  }
  .hero-photo{
    position:absolute;
    top:4px;
    left:-46px;
    width:290px;
    height:auto;
    transform:rotate(-8deg);
    pointer-events:none;
    user-select:none;
    z-index:0;
  }
  .hero-text{
    position:relative;
    z-index:1;
    margin-left:auto;
    margin-top:14px;
    text-align:right;
    max-width:62%;
    padding-right:4px;
  }
  .hero-value{
    font-size:36px;
    font-weight:300;
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    color:var(--milk);
    line-height:1.1;
  }
  .hero-label{
    font-size:13px;
    color:var(--text-dim);
    margin-top:8px;
    font-weight:500;
  }

  /* status strip */
  .statusrow{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .statuscard{
    flex:1;
    background:var(--surface);
    border-radius:var(--radius-sm);
    padding:16px 14px;
    border:1px solid var(--line);
  }
  .statuscard .n{ font-size:21px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .statuscard .l{ font-size:11.5px; color:var(--text-dim); margin-top:5px; line-height:1.3; }

  /* big action buttons */
  .actions{ display:flex; gap:12px; margin-bottom:22px; position:relative; z-index:2; }
  .actionbtn{
    flex:1;
    border:none;
    border-radius:var(--radius);
    padding:22px 10px 18px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-family:inherit;
    cursor:pointer;
    transition:transform 0.12s ease;
  }
  .actionbtn:active{ transform:scale(0.96); }
  .actionbtn.feed{ background:linear-gradient(160deg, var(--milk), #d9ab54); color:#241d0a; }
  .actionbtn.diaper{ background:linear-gradient(160deg, var(--diaper), #4f8c78); color:#0d1e19; }
  .actionbtn .ico{ font-size:28px; }
  .actionbtn .lbl{ font-size:15px; font-weight:700; }

  .sectiontitle{
    font-size:13px;
    color:var(--text-dim);
    font-weight:600;
    margin:40px 0 16px 0;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }

  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 4px;
  }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.feed{ background:var(--milk); }
  .dot.wet{ background:var(--wet); }
  .dot.dirty{ background:var(--dirty); }
  .dot.both{ background:var(--both); }
  .entry .main{ flex:1; }
  .entry .title{ font-size:14.5px; font-weight:600; font-variant-numeric:tabular-nums; }
  .entry .sub{ font-size:12.5px; color:var(--text-dim); margin-top:1px; }
  .entry .time{ font-size:12px; color:var(--text-dim); text-align:right; line-height:1.4; font-variant-numeric:tabular-nums; }
  .entry.editable{ cursor:pointer; }
  .entry.editable:active{ background:var(--surface-2); }
  .entry .chev{ color:var(--text-dim); font-size:18px; margin-left:2px; }

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    padding:34px 10px;
    background:var(--surface);
    border-radius:var(--radius-sm);
    border:1px dashed var(--line);
  }

  /* tabs for summary period */
  .periodtabs{
    display:flex;
    background:var(--surface);
    border-radius:999px;
    padding:4px;
    margin:12px 0 32px 0;
    border:1px solid var(--line);
  }
  .periodtabs button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:9px 0;
    border-radius:999px;
    cursor:pointer;
  }
  .periodtabs button.active{ background:var(--surface-2); color:var(--text); }

  .statgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:8px;
  }
  .statbig{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:16px;
  }
  .statbig .v{ font-size:25px; font-weight:700; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
  .statbig .k{ font-size:12px; color:var(--text-dim); margin-top:5px; line-height:1.3; }

  .chartcard{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:24px;
  }
  .chartcard h3{ font-size:13.5px; margin:0 0 14px 0; color:var(--text-dim); font-weight:600; }
  .chartwrap{ position:relative; height:180px; }
  .chartwrap.tappable{ cursor:pointer; }
  .detailmodal{ max-height:96dvh; }

  .legend{ display:flex; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .legend span{ font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* bottom tab bar */
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:480px;
    margin:0 auto;
    z-index:20;
    background:var(--bg);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
  }
  .tabbar::before{
    content:'';
    position:absolute;
    left:0; right:0;
    bottom:100%;
    height:32px;
    background:linear-gradient(to bottom, rgba(21,22,31,0), var(--bg));
    pointer-events:none;
  }
  .tabbtn{
    flex:1;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:8px 0;
    cursor:pointer;
    transition:transform 0.1s ease;
  }
  .tabbtn:active{ transform:scale(0.92); }
  .tabbtn .ico{ display:flex; }
  .tabbtn .ico svg{ width:22px; height:22px; display:block; }
  .tabbtn .lbl{ font-size:10.5px; font-weight:600; }
  .tabbtn.active{ color:var(--milk); }

  /* modal */
  .modalbg{
    position:fixed;
    top:0; left:0; right:0;
    height:100dvh;
    background:rgba(10,10,15,0.6);
    display:flex; align-items:flex-end;
    z-index:50;
    animation:fadeIn 0.18s ease-out;
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  .modal{
    background:var(--surface);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:24px 24px 0 0;
    padding:22px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
    border:1px solid var(--line);
    border-bottom:none;
    animation:slideUp 0.22s cubic-bezier(.32,.72,.35,1);
    max-height:92dvh;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .modal h2{ font-size:19px; margin:0 0 20px 0; letter-spacing:-0.01em; }
  .field{ margin-bottom:18px; }
  .field label{ font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:8px; font-weight:600; }
  .amtrow{ display:flex; align-items:center; gap:12px; }
  .amtbtn{
    width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font-size:20px; cursor:pointer;
  }
  .amtval{ flex:1; text-align:center; font-size:24px; font-weight:700; }
  .amtinput{
    width:100%; padding:16px; border-radius:var(--radius-sm);
    border:1.5px solid var(--line); background:var(--surface-2); color:var(--text);
    font-family:inherit; font-size:32px; font-weight:700; text-align:center;
    transition:border-color 0.15s ease;
  }
  .amtinput:focus{ outline:none; border-color:var(--milk); }
  .presetrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .presetchip{
    flex:1; min-width:56px; padding:9px 0; text-align:center;
    border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .presetchip:active{ background:var(--milk-dim); color:var(--milk); }
  .unittoggle{ display:flex; gap:6px; }
  .unittoggle button{
    padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .unittoggle button.active{ background:var(--milk); color:#241d0a; border-color:var(--milk); }

  /* custom iOS-style scrolling wheel picker */
  .pickersummary{
    width:100%; padding:14px 16px; border-radius:var(--radius-sm);
    border:1.5px solid var(--line); background:var(--surface-2); color:var(--text);
    font-family:inherit; font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .pickersummary:active{ border-color:var(--milk); }
  .wheelpicker{
    position:relative;
    display:flex;
    height:180px;
    background:var(--surface-2);
    border-radius:var(--radius-sm);
    border:1.5px solid var(--line);
    overflow:hidden;
  }
  .wheelcol{
    flex:1.3;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .wheelcol:nth-child(2), .wheelcol:nth-child(3), .wheelcol:nth-child(4){ flex:0.75; }
  .wheelcol::-webkit-scrollbar{ display:none; }
  .wheelpad{ height:72px; flex-shrink:0; }
  .wheelitem{
    height:36px;
    display:flex; align-items:center; justify-content:center;
    scroll-snap-align:center;
    color:var(--text-dim);
    font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .wheelitem.selected{ color:var(--text); font-weight:700; }
  .wheel-highlight{
    position:absolute; top:72px; left:0; right:0; height:36px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    pointer-events:none;
  }

  input[type=datetime-local], input[type=text], input[type=time], input[type=date]{
    width:100%; padding:13px 14px; border-radius:var(--radius-sm);
    border:1.5px solid var(--line); background:var(--surface-2); color:var(--text);
    font-family:inherit; font-size:16px;
    color-scheme:dark;
  }
  input[type=datetime-local]:focus, input[type=text]:focus, input[type=time]:focus, input[type=date]:focus{ outline:none; border-color:var(--milk); }
  .typegrid{ display:flex; gap:10px; }
  .typegrid button{
    flex:1; padding:18px 8px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
    transition:transform 0.1s ease;
  }
  .typegrid button:active{ transform:scale(0.96); }
  .typegrid button.sel{ color:#0d1e19; }
  .typegrid button[data-t=wet].sel{ background:var(--wet); border-color:var(--wet); color:#0a1c2b; }
  .typegrid button[data-t=dirty].sel{ background:var(--dirty); border-color:var(--dirty); color:#2b1707; }
  .typegrid button[data-t=both].sel{ background:var(--both); border-color:var(--both); color:#1c1330; }

  .modalbtns{ display:flex; gap:10px; margin-top:8px; }
  .btn{
    flex:1; padding:15px; border-radius:var(--radius-sm); border:none;
    font-family:inherit; font-weight:700; font-size:15.5px; cursor:pointer;
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  .btn:active{ transform:scale(0.97); opacity:0.9; }
  .btn.primary{ background:var(--milk); color:#241d0a; }
  .btn.primary.diaper{ background:var(--diaper); color:#0d1e19; }
  .btn.ghost{ background:var(--surface-2); color:var(--text-dim); }

  .settingsblock{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .settingsblock h3{ font-size:14px; margin:0 0 14px 0; }
  .settingsblock .help{ font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.5; }

  .lovecard{
    text-align:center;
    padding:8px 16px 40px 16px;
  }
  .lovephoto{
    width:310px;
    max-width:88%;
    height:auto;
    margin:28px auto 0 auto;
    display:block;
    border-radius:20px;
  }
  .loveheart{
    font-size:40px;
    line-height:1;
    animation:heartbeat 2.4s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%, 100%{ transform:scale(1); }
    15%{ transform:scale(1.12); }
    30%{ transform:scale(1); }
    45%{ transform:scale(1.08); }
    60%{ transform:scale(1); }
  }
  .lovetitle{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin-top:14px;
    line-height:1.4;
  }
  .lovesub{
    font-size:13px;
    color:var(--text-dim);
    margin-top:10px;
    line-height:1.6;
    max-width:260px;
    margin-left:auto;
    margin-right:auto;
  }
  textarea, .urlinput{
    width:100%; padding:12px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--line); background:var(--surface-2); color:var(--text);
    font-family:inherit; font-size:14px; resize:none;
  }
  .savedchip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--diaper); margin-top:8px; }

  .banner{
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 14px; font-size:13px; color:var(--text-dim); margin-bottom:16px; display:flex; gap:10px; align-items:flex-start;
  }
  .banner.err{ border-color: var(--danger); color:#f3c9c5; }
  .spinner{
    width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--milk);
    animation:spin 0.8s linear infinite; flex-shrink:0; margin-top:2px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .minispinner{
    display:inline-block; width:10px; height:10px; border-radius:50%;
    border:1.5px solid var(--line); border-top-color:var(--milk);
    animation:spin 0.7s linear infinite; margin-left:6px; vertical-align:middle;
  }
  .refreshbtn{
    background:none; border:none; color:var(--text-dim); font-size:12.5px; font-family:inherit;
    display:flex; align-items:center; gap:5px; cursor:pointer; padding:4px 0;
  }
  .iconbtn{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:4px; margin:0; flex-shrink:0;
  }
  .iconbtn svg{ width:15px; height:15px; }
  .iconbtn:active{ color:var(--milk); }
</style>
</head>

<script>
/* the app now runs on its own static host, and talks to your Apps Script
   Web App URL as a plain JSON API. Update this if you ever redeploy to a
   different exec URL. */
const API_URL = "https://script.google.com/macros/s/AKfycbzg80UZ8CATTR91HqWhezRGKjxgJAuDdj7XjYjVf698tJtzTeAHWZFmIqyjyqgORWff/exec";
// Must match SHARED_SECRET in Code.gs exactly. This is a basic filter against
// automated abuse, not real security — see the Settings tab note.
const API_KEY = "9G-nekyWDuGTE5sJNULr4wPigZUeMEqR";

// Her date of birth, used to compute age for the growth percentile chart.
const BIRTH_DATE = new Date('2026-07-10T00:00:00');

/* ---------------- WHO growth standard reference (girls, weight-for-age) ----------------
   Approximate WHO Child Growth Standard percentile values (kg) for girls,
   birth to 24 completed months, at the 3rd/15th/50th/85th/97th percentiles.
   This is a general-awareness reference, not a diagnostic tool — always
   confirm growth concerns with a pediatrician, who uses the exact WHO tables. */
const WHO_WFA_GIRLS = [
  {m:0,  p3:2.4, p15:2.8, p50:3.2, p85:3.7, p97:4.2},
  {m:1,  p3:3.2, p15:3.6, p50:4.2, p85:4.8, p97:5.5},
  {m:2,  p3:3.9, p15:4.5, p50:5.1, p85:5.8, p97:6.6},
  {m:3,  p3:4.5, p15:5.2, p50:5.8, p85:6.6, p97:7.5},
  {m:4,  p3:5.0, p15:5.7, p50:6.4, p85:7.3, p97:8.2},
  {m:5,  p3:5.4, p15:6.1, p50:6.9, p85:7.8, p97:8.8},
  {m:6,  p3:5.7, p15:6.5, p50:7.3, p85:8.2, p97:9.3},
  {m:7,  p3:5.9, p15:6.8, p50:7.6, p85:8.6, p97:9.8},
  {m:8,  p3:6.2, p15:7.0, p50:7.9, p85:8.9, p97:10.2},
  {m:9,  p3:6.4, p15:7.3, p50:8.2, p85:9.3, p97:10.5},
  {m:10, p3:6.6, p15:7.5, p50:8.5, p85:9.6, p97:10.9},
  {m:11, p3:6.8, p15:7.7, p50:8.7, p85:9.9, p97:11.2},
  {m:12, p3:6.9, p15:7.9, p50:8.9, p85:10.1, p97:11.5},
  {m:13, p3:7.1, p15:8.1, p50:9.2, p85:10.4, p97:11.8},
  {m:14, p3:7.3, p15:8.3, p50:9.4, p85:10.6, p97:12.1},
  {m:15, p3:7.5, p15:8.5, p50:9.6, p85:10.9, p97:12.4},
  {m:16, p3:7.6, p15:8.7, p50:9.8, p85:11.1, p97:12.6},
  {m:17, p3:7.8, p15:8.9, p50:10.0, p85:11.4, p97:12.9},
  {m:18, p3:7.9, p15:9.1, p50:10.2, p85:11.6, p97:13.2},
  {m:19, p3:8.1, p15:9.2, p50:10.4, p85:11.8, p97:13.5},
  {m:20, p3:8.3, p15:9.4, p50:10.6, p85:12.1, p97:13.7},
  {m:21, p3:8.4, p15:9.6, p50:10.9, p85:12.3, p97:14.0},
  {m:22, p3:8.6, p15:9.8, p50:11.0, p85:12.5, p97:14.3},
  {m:23, p3:8.7, p15:9.9, p50:11.2, p85:12.8, p97:14.6},
  {m:24, p3:8.9, p15:10.1,p50:11.5, p85:13.0, p97:14.8}
];
const LB_TO_KG = 0.45359237;

function ageInMonths(ts){
  const days = (ts.getTime() - BIRTH_DATE.getTime()) / 86400000;
  return days / 30.4368;
}
function interpolateWhoRow(months){
  const clamped = Math.max(0, Math.min(24, months));
  const lo = Math.floor(clamped), hi = Math.ceil(clamped);
  const a = WHO_WFA_GIRLS[lo], b = WHO_WFA_GIRLS[hi];
  if(lo===hi) return a;
  const t = clamped - lo;
  const lerp = (k)=> a[k] + (b[k]-a[k])*t;
  return {p3:lerp('p3'), p15:lerp('p15'), p50:lerp('p50'), p85:lerp('p85'), p97:lerp('p97')};
}
function estimatePercentile(weightKg, months){
  const row = interpolateWhoRow(months);
  const points = [[3,row.p3],[15,row.p15],[50,row.p50],[85,row.p85],[97,row.p97]];
  if(weightKg <= points[0][1]) return '<3rd';
  if(weightKg >= points[points.length-1][1]) return '>97th';
  for(let i=1;i<points.length;i++){
    const [pLo,vLo] = points[i-1], [pHi,vHi] = points[i];
    if(weightKg <= vHi){
      const t = (weightKg - vLo) / (vHi - vLo);
      return Math.round(pLo + (pHi-pLo)*t) + suffix(Math.round(pLo + (pHi-pLo)*t));
    }
  }
  return '—';
}
function suffix(n){
  if(n%100>=11 && n%100<=13) return 'th';
  switch(n%10){ case 1: return 'st'; case 2: return 'nd'; case 3: return 'rd'; default: return 'th'; }
}

/* ---------------- data fetch / write ---------------- */
function sheetBase(){ return API_URL; }
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function scrollToTop(){ window.scrollTo(0, 0); }

const CACHE_KEY = 'kunju_data_cache';

function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      feedings: state.feedings, diapers: state.diapers, weights: state.weights
    }));
  }catch(e){ /* storage full or unavailable — safe to ignore, just no cache */ }
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    const revive = (arr)=> (arr||[]).map(x=> Object.assign({}, x, { ts: new Date(x.ts) })).filter(x=>!isNaN(x.ts));
    state.feedings = revive(data.feedings);
    state.diapers = revive(data.diapers);
    state.weights = revive(data.weights);
    return state.feedings.length + state.diapers.length + state.weights.length > 0;
  }catch(e){ return false; }
}

async function fetchAll(){
  // only show a loading state if we have nothing on screen yet — once
  // there's cached/previous data visible, refreshes happen quietly
  const silent = state.loaded;
  if(!silent){ state.loading = true; render(); }
  state.backgroundRefreshing = true;
  if(silent) render();
  state.loadError = null;
  try{
    const [fRes, dRes, wRes] = await Promise.all([
      fetch(sheetBase() + '?sheet=Feedings&key=' + encodeURIComponent(API_KEY) + '&t=' + Date.now()),
      fetch(sheetBase() + '?sheet=Diapers&key=' + encodeURIComponent(API_KEY) + '&t=' + Date.now()),
      fetch(sheetBase() + '?sheet=Weights&key=' + encodeURIComponent(API_KEY) + '&t=' + Date.now())
    ]);
    const fJson = await fRes.json();
    const dJson = await dRes.json();
    const wJson = await wRes.json();
    if(fJson.error || dJson.error || wJson.error) throw new Error(fJson.error || dJson.error || wJson.error);
    state.feedings = (Array.isArray(fJson)?fJson:[]).map(normalizeFeed).filter(x=>x.ts);
    state.diapers = (Array.isArray(dJson)?dJson:[]).map(normalizeDiaper).filter(x=>x.ts);
    state.weights = (Array.isArray(wJson)?wJson:[]).map(normalizeWeight).filter(x=>x.ts);
    state.feedings.sort((a,b)=>b.ts-a.ts);
    state.diapers.sort((a,b)=>b.ts-a.ts);
    state.weights.sort((a,b)=>b.ts-a.ts);
    state.loaded = true;
    saveCache();
  }catch(e){
    // if we already have cached data on screen, a failed background
    // refresh shouldn't blank it out or alarm the person — just skip
    // showing the error and quietly try again next time
    if(!state.loaded) state.loadError = "Couldn't reach the sheet. Check that the Web App is deployed with access set to Anyone.";
  }
  state.loading = false;
  state.backgroundRefreshing = false;
  render();
  if(state.tab==='trends' && !state.modal) setTimeout(drawCharts, 30);
  if(state.modal==='weightDetail') setTimeout(()=>drawWeightChart('weightChartExpanded', true), 30);
}
function normalizeFeed(row){
  const ts = new Date(row.Timestamp);
  return { id: row.Id || '', ts: isNaN(ts) ? null : ts, amount: Number(row.Amount)||0, unit: row.Unit||'ml' };
}
function normalizeDiaper(row){
  const ts = new Date(row.Timestamp);
  return { id: row.Id || '', ts: isNaN(ts) ? null : ts, type: row.Type||'wet' };
}
function normalizeWeight(row){
  const ts = new Date(row.Timestamp);
  return { id: row.Id || '', ts: isNaN(ts) ? null : ts, weightKg: Number(row.Weight)||0 };
}

  });
}

/* ---------------- helpers ---------------- */
function fmtTime(d){
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function fmtDay(d){
  const today = new Date(); const y = new Date(); y.setDate(y.getDate()-1);
  if(d.toDateString()===today.toDateString()) return 'Today';
  if(d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}
function timeSince(d){
  const mins = Math.floor((Date.now()-d.getTime())/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const h = Math.floor(mins/60); const m = mins%60;
  return h + 'h ' + (m? m+'m ':'') + 'ago';
}
function withinHours(d, hrs){ return (Date.now()-d.getTime()) <= hrs*3600*1000; }
function dayKey(d){ return d.toISOString().slice(0,10); }
const OZ_TO_ML = 29.5735;
function toMl(amount, unit){ return unit==='oz' ? amount*OZ_TO_ML : amount; }

    </div>

}

function drawCharts(){
  const feedCanvas = document.getElementById('feedChart');
  const diaperCanvas = document.getElementById('diaperChart');
  if(!feedCanvas || !diaperCanvas || typeof Chart === 'undefined') return;

  const nDays = daysForPeriod(state.period);
  const labels = [];
  const dayKeys = [];
  const now = new Date();
  for(let i=nDays-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i);
    dayKeys.push(dayKey(d));
    labels.push(d.toLocaleDateString([], nDays<=7 ? {weekday:'short'} : {month:'short', day:'numeric'}));
  }
  const ozByDay = dayKeys.map(k => state.feedings.filter(f=>dayKey(f.ts)===k).reduce((s,f)=>s+toMl(f.amount,f.unit),0));
  const wetByDay = dayKeys.map(k => state.diapers.filter(d=>dayKey(d.ts)===k && d.type==='wet').length);
  const dirtyByDay = dayKeys.map(k => state.diapers.filter(d=>dayKey(d.ts)===k && d.type==='dirty').length);
  const bothByDay = dayKeys.map(k => state.diapers.filter(d=>dayKey(d.ts)===k && d.type==='both').length);

  if(feedChartInstance) feedChartInstance.destroy();
  if(diaperChartInstance) diaperChartInstance.destroy();

  const gridColor = 'rgba(255,255,255,0.06)';
  const tickColor = '#9C9DB2';

  feedChartInstance = new Chart(feedCanvas, {
    type:'line',
    data:{ labels, datasets:[{ label:'mL', data: ozByDay, borderColor:'#F2C879', backgroundColor:'rgba(242,200,121,0.15)', fill:true, tension:0.35, pointRadius:3 }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ grid:{ color:gridColor }, ticks:{ color:tickColor, font:{size:10.5} } },
        y:{ grid:{ color:gridColor }, ticks:{ color:tickColor, font:{size:10.5} }, beginAtZero:true }
      }
    }
  });

  diaperChartInstance = new Chart(diaperCanvas, {
    type:'bar',
    data:{ labels, datasets:[
      { label:'wet', data:wetByDay, backgroundColor:'#7FB0D8' },
      { label:'dirty', data:dirtyByDay, backgroundColor:'#C98A5A' },
      { label:'both', data:bothByDay, backgroundColor:'#A98AC9' }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ stacked:true, grid:{ display:false }, ticks:{ color:tickColor, font:{size:10.5} } },
        y:{ stacked:true, grid:{ color:gridColor }, ticks:{ color:tickColor, font:{size:10.5} }, beginAtZero:true }
      }
    }
  });

  drawWeightChart('weightChart', false);
}

function localInputValue(d){

/* ---------------- custom wheel date+time picker ----------------
   Native <input type="datetime-local"> renders inconsistently across
   iOS/Safari versions, so this replicates the classic iOS scrolling
   wheel (date | hour | minute | AM/PM) directly, giving a guaranteed
   consistent look regardless of device/browser quirks. */
const WHEEL_ITEM_H = 36;
const WHEEL_DAYS_BACK = 60; // how far back the date column scrolls

function wheelDateLabel(offsetDays){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+offsetDays);
  if(offsetDays===0) return 'Today';
  if(offsetDays===-1) return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
}
function buildWheelCol(id, items){
  return `<div class="wheelcol" id="${id}">
    <div class="wheelpad"></div>
    ${items.map(it=>`<div class="wheelitem">${it}</div>`).join('')}
    <div class="wheelpad"></div>
  </div>`;
}
function renderWheelPicker(prefix){
  const dateItems = []; for(let o=-WHEEL_DAYS_BACK; o<=0; o++) dateItems.push(wheelDateLabel(o));
  const hourItems = []; for(let h=1; h<=12; h++) hourItems.push(String(h));
  const minItems = []; for(let m=0; m<60; m++) minItems.push(String(m).padStart(2,'0'));
  const ampmItems = ['AM','PM'];
  return `
  <div class="wheelpicker">
    ${buildWheelCol(prefix+'-wp-date', dateItems)}
    ${buildWheelCol(prefix+'-wp-hour', hourItems)}
    ${buildWheelCol(prefix+'-wp-min', minItems)}
    ${buildWheelCol(prefix+'-wp-ampm', ampmItems)}
    <div class="wheel-highlight"></div>
  </div>`;
}
function initWheelPicker(prefix, dateObj){
  const d = new Date(dateObj);
  const today = new Date(); today.setHours(0,0,0,0);
  const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
  let offsetDays = Math.round((dOnly-today)/86400000);
  offsetDays = Math.max(-WHEEL_DAYS_BACK, Math.min(0, offsetDays));
  const dateIndex = offsetDays + WHEEL_DAYS_BACK;

  const hour24 = d.getHours();
  const ampmIndex = hour24>=12 ? 1 : 0;
  let hour12 = hour24%12; if(hour12===0) hour12 = 12;
  const hourIndex = hour12-1;
  const minuteIndex = d.getMinutes();

  const cols = [
    [prefix+'-wp-date', dateIndex],
    [prefix+'-wp-hour', hourIndex],
    [prefix+'-wp-min', minuteIndex],
    [prefix+'-wp-ampm', ampmIndex]
  ];
  cols.forEach(([id, idx])=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.scrollTop = idx*WHEEL_ITEM_H;
    const update = ()=>{
      const nearest = Math.round(el.scrollTop/WHEEL_ITEM_H);
      el.querySelectorAll('.wheelitem').forEach((it,i)=>{ it.classList.toggle('selected', i===nearest); });
    };
    update();
    el.addEventListener('scroll', update, {passive:true});
  });
}
function readWheelPicker(prefix){
  const idx = (id, max)=>{
    const el = document.getElementById(id);
    if(!el) return 0;
    return Math.max(0, Math.min(max, Math.round(el.scrollTop/WHEEL_ITEM_H)));
  };
  const dateIdx = idx(prefix+'-wp-date', WHEEL_DAYS_BACK);
  const offsetDays = dateIdx - WHEEL_DAYS_BACK;
  const hour12 = idx(prefix+'-wp-hour', 11) + 1;
  const minute = idx(prefix+'-wp-min', 59);
  const isPM = idx(prefix+'-wp-ampm', 1) === 1;

  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+offsetDays);
  let hour24 = hour12 % 12; if(isPM) hour24 += 12;
  d.setHours(hour24, minute, 0, 0);
  return d;
}
function formatPickerSummary(d){
  return `${fmtDay(d)}, ${fmtTime(d)}`;
}
function renderPickerField(prefix, dateObj, isOpen){
  if(isOpen) return renderWheelPicker(prefix);
  return `<button type="button" class="pickersummary" id="${prefix}-picker-toggle">
    <span>${formatPickerSummary(dateObj)}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;"><path d="M6 9l6 6 6-6"/></svg>
  </button>`;
}

/* ---------------- event wiring ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; render(); scrollToTop(); if(state.tab==='trends') setTimeout(drawCharts, 30); };
  });
  document.querySelectorAll('[data-open]').forEach(b=>{
    b.onclick = ()=>{ if(b.dataset.open==='feed') openAddFeed(); else openAddDiaper(); };
  });
  document.querySelectorAll('[data-period]').forEach(b=>{
    b.onclick = ()=>{ state.period = Number(b.dataset.period); render(); if(state.tab==='trends') setTimeout(drawCharts, 30); };
  });
  const refreshHome = document.getElementById('refresh-home');
  if(refreshHome) refreshHome.onclick = fetchAll;
  const loadMoreActivity = document.getElementById('load-more-activity');
  if(loadMoreActivity) loadMoreActivity.onclick = ()=>{ state.recentWindowDays += 7; render(); };

  /* feed modal */
  const feedAmtInput = document.getElementById('feed-amt-input');
  if(feedAmtInput) feedAmtInput.oninput = ()=>{ feedAmount = Number(feedAmtInput.value) || 0; };
  const feedPickerToggle = document.getElementById('feed-picker-toggle');
  if(feedPickerToggle) feedPickerToggle.onclick = ()=>{ feedPickerOpen = true; render(); };
  document.querySelectorAll('.presetchip').forEach(b=>{
    b.onclick = ()=>{
      if(feedPickerOpen) feedTimeValue = readWheelPicker('feed');
      feedAmount = Number(b.dataset.preset);
      render();
    };
  });
  const feedCancel = document.getElementById('feed-cancel');
  if(feedCancel) feedCancel.onclick = ()=>{ state.modal=null; state.editingId=null; render(); scrollToTop(); };
  const feedSave = document.getElementById('feed-save');
  if(feedSave) feedSave.onclick = async ()=>{
    const dateObj = feedPickerOpen ? readWheelPicker('feed') : feedTimeValue;
    const amt = Number(document.getElementById('feed-amt-input').value) || 0;
    if(state.editingId){
      await updateFeed(state.editingId, amt, 'ml', dateObj);
    }else{
      await logFeed(amt, 'ml', dateObj);
    }
    feedAmount = 0;
  };
  const feedDelete = document.getElementById('feed-delete');
  if(feedDelete) feedDelete.onclick = async ()=>{
    if(confirm('Delete this bottle entry?')) await deleteFeed(state.editingId);
  };

  /* diaper modal */
  document.querySelectorAll('.typegrid button').forEach(b=>{
    b.onclick = ()=>{ diaperType = b.dataset.t; document.querySelectorAll('.typegrid button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
  });
  const diaperPickerToggle = document.getElementById('diaper-picker-toggle');
  if(diaperPickerToggle) diaperPickerToggle.onclick = ()=>{ diaperPickerOpen = true; render(); };
  const diaperCancel = document.getElementById('diaper-cancel');
  if(diaperCancel) diaperCancel.onclick = ()=>{ state.modal=null; state.editingId=null; render(); scrollToTop(); };
  const diaperSave = document.getElementById('diaper-save');
  if(diaperSave) diaperSave.onclick = async ()=>{
    const dateObj = diaperPickerOpen ? readWheelPicker('diaper') : diaperTimeValue;
    if(state.editingId){
      await updateDiaper(state.editingId, diaperType, dateObj);
    }else{
      await logDiaper(diaperType, dateObj);
    }
  };
  const diaperDelete = document.getElementById('diaper-delete');
  if(diaperDelete) diaperDelete.onclick = async ()=>{
    if(confirm('Delete this diaper entry?')) await deleteDiaper(state.editingId);
  };

  /* weight modal */
  const openWeightBtn = document.getElementById('open-weight');
  if(openWeightBtn) openWeightBtn.onclick = openAddWeight;
  const openWeightDetail = document.getElementById('open-weight-detail');
  if(openWeightDetail) openWeightDetail.onclick = ()=>{ state.modal = 'weightDetail'; render(); };
  const weightDetailClose = document.getElementById('weightdetail-close');
  if(weightDetailClose) weightDetailClose.onclick = ()=>{ state.modal = null; render(); if(state.tab==='trends') setTimeout(drawCharts, 30); };
  const weightAmtInput = document.getElementById('weight-amt-input');
  if(weightAmtInput) weightAmtInput.oninput = ()=>{ weightAmount = Number(weightAmtInput.value) || 0; };
  document.querySelectorAll('#weight-unit-toggle button').forEach(b=>{
    b.onclick = ()=>{
      const amtEl = document.getElementById('weight-amt-input');
      const raw = amtEl ? Number(amtEl.value)||0 : weightAmount;
      // convert the currently-entered number between kg/lb when switching
      if(b.dataset.u==='lb' && weightUnit==='kg') weightAmount = raw / LB_TO_KG;
      else if(b.dataset.u==='kg' && weightUnit==='lb') weightAmount = raw * LB_TO_KG;
      weightUnit = b.dataset.u;
      render();
    };
  });
  const weightCancel = document.getElementById('weight-cancel');
  if(weightCancel) weightCancel.onclick = ()=>{ state.modal=null; state.editingId=null; render(); scrollToTop(); };
  const weightSave = document.getElementById('weight-save');
  if(weightSave) weightSave.onclick = async ()=>{
    const dstr = document.getElementById('weight-time').value;
    const dateObj = new Date(dstr + 'T12:00:00');
    const raw = Number(document.getElementById('weight-amt-input').value) || 0;
    const kg = weightUnit==='lb' ? raw * LB_TO_KG : raw;
    if(state.editingId){
      await updateWeight(state.editingId, kg, dateObj);
    }else{
      await logWeight(kg, dateObj);
    }
    weightAmount = 0;
  };
  const weightDelete = document.getElementById('weight-delete');
  if(weightDelete) weightDelete.onclick = async ()=>{
    if(confirm('Delete this weigh-in?')) await deleteWeight(state.editingId);
  };

  /* tap an entry row to edit it */
  document.querySelectorAll('[data-edit]').forEach(row=>{
    row.onclick = ()=>{
      const kind = row.dataset.edit;
      const id = row.dataset.id;
      if(kind==='feed') openEditFeed(id);
      else if(kind==='weight') openEditWeight(id);
      else openEditDiaper(id);
    };
  });
}

/* ---------------- keyboard-safe modal positioning ----------------
   position:fixed elements are sized against the layout viewport, which
   iOS Safari does NOT shrink when the keyboard opens — only the visual
   viewport shrinks. 100dvh handles most of this on modern iOS, but this
   keeps the modal correctly pinned above the keyboard as a fallback. */
function setupViewportGuard(){
  if(!window.visualViewport) return;
  const sync = ()=>{
    const bg = document.querySelector('.modalbg');
    if(!bg) return;
    bg.style.height = window.visualViewport.height + 'px';
    bg.style.top = window.visualViewport.offsetTop + 'px';
  };
  window.visualViewport.addEventListener('resize', sync);
  window.visualViewport.addEventListener('scroll', sync);
}

/* ---------------- boot ---------------- */
(async function boot(){
  await loadConfig();
  if(loadCache()){ state.loaded = true; } // instant first paint from last-known data
  render();
  if(state.config) fetchAll(); // quietly refreshes with live data in the background
  setupViewportGuard();
  setInterval(()=>{ if(state.tab==='home') render(); }, 60000);
})();
